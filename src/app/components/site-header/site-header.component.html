<header class="site-header">
  <div class="container header-inner">
    <a routerLink="/" class="brand">
      <app-brand-mark [size]="28" />
      <span class="brand-text">{{ brand.productName }}</span>
    </a>

    <!--
      routerLink + fragment instead of a plain href so these links work
      regardless of the build's base-href (custom domain at "/" vs Pages
      sub-path "/lci-marketing/"). Also lets the router scroll to the
      anchor instead of doing a hard reload.
    -->
    <nav class="primary-nav" aria-label="Primary">
      <ul>
        <li><a routerLink="/" fragment="how-it-works">How it works</a></li>
        <li><a routerLink="/" fragment="features">Features</a></li>
        <li><a routerLink="/" fragment="pricing">Pricing</a></li>
        <li><a routerLink="/" fragment="faq">FAQ</a></li>
      </ul>
    </nav>

    <span class="status-pill" aria-label="Project status">Coming soon</span>
  </div>
</header>
